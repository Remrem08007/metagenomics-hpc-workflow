name: Materialize biological fixture

on:
  push:
    branches:
      - agent/portfolio-cleanup
    paths:
      - .github/workflows/materialize-test-data.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portfolio-cleanup

      - name: Generate deterministic mock community
        run: |
          bash scripts/setup_test_data.sh \
            --output-dir "$RUNNER_TEMP/metagenomics_test" \
            --force

      - name: Stage portable fixture
        run: |
          FIXTURE="tests/fixtures/mock-community"
          mkdir -p "$FIXTURE/data"

          cp "$RUNNER_TEMP/metagenomics_test/data/mock-community_R1.fastq.gz" "$FIXTURE/data/"
          cp "$RUNNER_TEMP/metagenomics_test/data/mock-community_R2.fastq.gz" "$FIXTURE/data/"
          cp "$RUNNER_TEMP/metagenomics_test/data/ground_truth.tsv" "$FIXTURE/data/"
          cp "$RUNNER_TEMP/metagenomics_test/data/mixture.tsv" "$FIXTURE/data/"
          cp "$RUNNER_TEMP/metagenomics_test/data/expected_taxa.tsv" "$FIXTURE/data/"
          cp "$RUNNER_TEMP/metagenomics_test/data/expected_qc.tsv" "$FIXTURE/data/"

          cat > "$FIXTURE/data/samplesheet.csv" <<'EOF'
          sample,fastq_1,fastq_2
          mock-community,mock-community_R1.fastq.gz,mock-community_R2.fastq.gz
          EOF

      - name: Commit generated fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/mock-community
          git diff --cached --quiet && exit 0
          git commit -m "Materialize biological mock fixture"
          git push origin HEAD:agent/portfolio-cleanup
