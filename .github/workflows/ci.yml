name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2

      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Shell syntax
        run: |
          bash -n scripts/lib/module_utils.sh
          bash -n scripts/pull_containers.sh
          bash -n scripts/download_databases.sh
          bash -n scripts/verify_assets.sh
          bash -n scripts/run_pipeline.sh
          bash -n scripts/submit_pipeline.sbatch

      - name: Stub workflow
        run: nextflow run main.nf -profile test -stub-run
